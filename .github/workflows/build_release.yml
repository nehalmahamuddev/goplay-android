name: Build & Release GoPlay App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v2.3.4)'
        required: false
        default: ''
      changelog:
        description: 'Changelog / Release notes (optional, overrides CHANGELOG.md)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Extract Changelog
        id: version_step
        run: |
          RAW_INPUT_TAG="${{ github.event.inputs.tag_name }}"
          REF_NAME="${{ github.ref_name }}"
          
          if [ -n "$RAW_INPUT_TAG" ]; then
            TAG_CLEAN=$(echo "$RAW_INPUT_TAG" | sed -E 's/^v//' | sed -E 's/-.*//')
            MAJOR=$(echo "$TAG_CLEAN" | cut -d. -f1)
            MINOR=$(echo "$TAG_CLEAN" | cut -d. -f2)
            PATCH=$(echo "$TAG_CLEAN" | cut -d. -f3)
            BUILD_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          elif [[ "$REF_NAME" =~ ^v[0-9] ]]; then
            TAG_CLEAN=$(echo "$REF_NAME" | sed -E 's/^v//' | sed -E 's/-.*//')
            MAJOR=$(echo "$TAG_CLEAN" | cut -d. -f1)
            MINOR=$(echo "$TAG_CLEAN" | cut -d. -f2)
            PATCH=$(echo "$TAG_CLEAN" | cut -d. -f3)
            BUILD_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          else
            # Push commit to main branch: extract from pubspec.yaml
            TAG_CLEAN=$(grep '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//;s/\+.*//' | tr -d ' \r\n')
            BUILD_CODE=$(grep '^version:' pubspec.yaml | sed -E 's/.*(\+|:)//' | tr -d ' \r\n')
          fi

          TAG_NAME="v$TAG_CLEAN"
          echo "version_name=$TAG_CLEAN" >> $GITHUB_OUTPUT
          echo "version_code=$BUILD_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Resolved version: $TAG_CLEAN ($BUILD_CODE) with tag $TAG_NAME"

          # Extract or generate release notes
          MANUAL_NOTES="${{ github.event.inputs.changelog }}"
          if [ -n "$MANUAL_NOTES" ]; then
            printf "%s\n" "$MANUAL_NOTES" > release_notes.md
          else
            python3 .github/scripts/extract_changelog.py "$TAG_CLEAN" "$TAG_NAME"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/goplay-release-key.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/goplay-release-key.jks
          EOF
            echo "Keystore restored successfully."
          else
            echo "No keystore secret found, falling back to debug signing."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version_step.outputs.version_name }}" \
            --build-number="${{ steps.version_step.outputs.version_code }}"

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/goplay.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoPlay-Release-APK
          path: release_apks/goplay.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag_name }}
          name: GoPlay ${{ steps.version_step.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: release_notes.md
          files: |
            release_apks/goplay.apk

