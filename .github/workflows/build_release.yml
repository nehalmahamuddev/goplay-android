name: Build & Release GoPlay App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v2.2.2)'
        required: false
        default: 'v2.2.2'
      changelog:
        description: 'Changelog / Release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version
        id: version_step
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG_CLEAN=$(echo "$RAW_TAG" | sed -E 's/^v//' | sed -E 's/-.*//')
          
          # If not valid tag format, extract from pubspec.yaml
          if [ -z "$TAG_CLEAN" ] || ! [[ "$TAG_CLEAN" =~ [0-9] ]]; then
            PUBSPEC_VER=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d ' \r\n')
            PUBSPEC_CODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//' | tr -d ' \r\n')
            TAG_CLEAN="$PUBSPEC_VER"
            BUILD_CODE="$PUBSPEC_CODE"
          else
            # Extract numeric parts to create a standard versionCode e.g. 2.2.2 -> 20202
            MAJOR=$(echo "$TAG_CLEAN" | cut -d. -f1)
            MINOR=$(echo "$TAG_CLEAN" | cut -d. -f2)
            PATCH=$(echo "$TAG_CLEAN" | cut -d. -f3)
            BUILD_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          fi
          
          echo "version_name=$TAG_CLEAN" >> $GITHUB_OUTPUT
          echo "version_code=$BUILD_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=v$TAG_CLEAN" >> $GITHUB_OUTPUT
          echo "Resolved version: $TAG_CLEAN ($BUILD_CODE)"

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/goplay-release-key.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/goplay-release-key.jks
          EOF
            echo "Keystore restored successfully."
          else
            echo "No keystore secret found, falling back to debug signing."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version_step.outputs.version_name }}" \
            --build-number="${{ steps.version_step.outputs.version_code }}"

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/goplay.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoPlay-Release-APK
          path: release_apks/goplay.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag_name }}
          name: GoPlay ${{ steps.version_step.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ${{ github.event.inputs.changelog || '✨ **What''s New in GoPlay:**
            • Real-time match streaming and live channel updates
            • Direct In-App update system powered by GitHub Releases
            • Enhanced playback stability and error recovery
            • TV remote navigation and performance optimizations' }}
          files: |
            release_apks/goplay.apk

